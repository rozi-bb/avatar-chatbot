[project]
name = "avatar-chatbot"
version = "0.1.0"
description = "Wayan, a voice chatbot for the lobby kiosk of a fictional hotel in Bali, built with LangGraph."
authors = [
    { name = "Rozi" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "backend"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"backend" = "src/backend"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"evals/*" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
markers = ["integration: calls a real external API (DeepSeek); run with -m integration"]
# Plain `pytest` never spends money; integration tests run only when asked for.
addopts = "-m 'not integration'"
