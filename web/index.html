<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayan · Taman Gumitir</title>
<style>
  :root {
    --bg: #cbb89c; --stage: #fbf5e9; --panel: #fffdf8; --text: #3b2b1d; --muted: #5e4b38;
    --line: #e4d6bf; --accent: #e0a800; --leaf: #2e7d4f; --sky: #2f6fa3; --error: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px system-ui, sans-serif; }
  /* The kiosk screen is portrait, about 1:2. Wayan's 2:3 stage takes the full width and the
     controls take the rest. A wider window (or a 9:16 screen) gets a centred 1:2 column. */
  main { width: min(100vw, 100svh / 2); height: 100svh; margin: 0 auto; display: flex; flex-direction: column;
         container-type: inline-size; overflow: hidden; }
  .stage { position: relative; width: 100%; flex: none; aspect-ratio: 2 / 3; background: rgb(107,168,210); overflow: hidden; }
  /* The courtyard is split into layers by scripts/bg_layers.py. The picture is 1331 x 2048; the scene keeps
     that shape and is centred, which is what background-size: cover did on the 2:3 stage. */
  .scene { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1331 / 2048; transform: translateY(-50%); }
  .layer { position: absolute; inset: 0; background: center / 100% 100% no-repeat; }
  .back { background-image: url(bg_back.svg); }
  .front { background-image: url(bg_front.svg); }
  .pots { background-image: url(bg_pots.svg); }
  /* Tree box from bg_layers.py; it sways round the trunk where it leaves the left edge (-40, 1000),
     in uneven gusts so it never settles into a metronome. */
  .tree-box { position: absolute; left: -9.0158%; top: 23.4375%; width: 40.5710%; height: 28.3203%; transform-origin: 14.81% 89.66%; }
  .tree { position: absolute; inset: 0; background: url(bg_tree.svg) center / 100% 100% no-repeat;
          transform-origin: 14.81% 89.66%; animation: sway 9s ease-in-out infinite; will-change: transform; }
  @keyframes sway { 0%, 100% { transform: rotate(-2.6deg); } 24% { transform: rotate(2.4deg); }
                    42% { transform: rotate(0.2deg); } 68% { transform: rotate(3.2deg); } 86% { transform: rotate(-1deg); } }
  /* Plant boxes and stem pivots from bg_layers.py; each pot keeps its own time so they never move as one. */
  .plant { position: absolute; background: center / 100% 100% no-repeat; animation: leaf 6.4s ease-in-out infinite; will-change: transform; }
  .plant.l { background-image: url(bg_plant_l.svg); left: 4.3602%; top: 73.3101%; width: 9.9409%; height: 9.1636%; transform-origin: 48.72% 98.37%; animation-delay: -1.4s; }
  .plant.m { background-image: url(bg_plant_m.svg); left: 29.2834%; top: 64.8184%; width: 10.6023%; height: 10.1284%; transform-origin: 50.48% 96.19%; animation-duration: 7.3s; animation-delay: -4.2s; }
  .plant.r { background-image: url(bg_plant_r.svg); left: 71.7051%; top: 65.9160%; width: 9.9042%; height: 8.9536%; transform-origin: 51.28% 97.09%; animation-duration: 5.8s; animation-delay: -2.7s; }
  @keyframes leaf { 0%, 100% { transform: rotate(-3.5deg); } 30% { transform: rotate(4deg); } 52% { transform: rotate(-0.5deg); } 76% { transform: rotate(3deg); } }
  /* Each cloud rides a full-width track from just off the left edge to just off the right. */
  .track { position: absolute; left: 0; width: 100%; animation: drift linear infinite; will-change: transform; }
  .cloud { position: absolute; right: 100%; width: var(--w); aspect-ratio: 300 / 120; background: url(bg_cloud.svg) center / contain no-repeat; }
  .t1 { top: 6%;  --w: 30%; animation-duration: 70s;  animation-delay: -22s; }
  .t2 { top: 13%; --w: 20%; animation-duration: 95s;  animation-delay: -70s; opacity: .9; }
  .t3 { top: 16%; --w: 24%; animation-duration: 120s; animation-delay: -30s; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100% + var(--w))); } }
  /* A blossom from the tree (bg_flower.svg), moved by dropBlossom in picture units. */
  .blossom { position: absolute; left: 0; top: 0; width: 6.9%; aspect-ratio: 92 / 98; background: url(bg_flower.svg) center / contain no-repeat; pointer-events: none; will-change: transform, opacity; }
  @media (prefers-reduced-motion: reduce) { .tree, .track, .plant { animation: none; } }
  /* Soft shadow under the sandals, measured for Wayan at 66%: soles 9.5% from the bottom, feet 35-65% across. */
  .shadow { position: absolute; left: 50%; bottom: 7.6%; width: 38%; aspect-ratio: 6 / 1; translate: -50% 0;
            background: radial-gradient(closest-side, rgba(110,80,50,.3) 70%, rgba(110,80,50,0)); }
  /* Wayan is drawn smaller than the stage so the house gate and pavilion stay visible around him. */
  canvas { position: absolute; left: 50%; bottom: 2%; width: var(--wayan, 66%); aspect-ratio: 2 / 3; transform: translateX(-50%); }
  /* Subtitle on the ground under the sandals. One line clears the soles; a second would cover the sandals,
     so pieces are cut to one line on a laptop (a phone may still wrap one, evenly).
     Text size follows the stage width (cqw): 15px on a phone, about 42px on a 1080px kiosk screen. */
  .stage { container-type: inline-size; }
  .subtitle { position: absolute; left: 50%; bottom: 2.5%; translate: -50% 0; width: max-content; max-width: 88%;
              padding: .35em .8em; border-radius: 14px; background: rgba(20,20,20,.68); backdrop-filter: blur(6px);
              font-size: clamp(15px, 3.9cqw, 60px); line-height: 1.4; font-weight: 600; text-align: center; text-wrap: balance; color: #fff;
              opacity: 0; transition: opacity .25s; pointer-events: none; }
  .subtitle.on { opacity: 1; }
  .subtitle .later { color: rgba(255,255,255,.55); }
  /* The guest's words, as speech-to-text hears them: in Wayan's subtitle spot, taking
     turns with it, blue so the two never mix up. Dimmer while still being recognised. */
  .subtitle.guest { background: rgba(18,52,86,.78); color: #e3f1ff; }
  .subtitle.guest.interim { color: rgba(227,241,255,.6); }
  /* The panel carries on the courtyard's sand (#d8c9b4, the ground at the stage's bottom edge), so it
     reads as the ground Wayan stands on, not a separate box. */
  .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2.4cqw;
           padding: 2cqw 7cqw 6cqw; background: linear-gradient(#d8c9b4, var(--bg)); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .moves { display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 8px; }
  .chips button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 4px 10px; font-size: 14px;
                  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
                  transition: border-color .15s, background-color .15s, color .15s; }
  .chips button:hover { border-color: #6a6a6a; background: #323232; }
  .chips .emo { font-size: 22px; line-height: 1; }
  .chips button.on { border-color: var(--accent); background: rgba(245,191,3,.1); color: var(--accent); }
  .composer { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); transition: border-color .15s; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { display: block; width: 100%; min-height: 128px; resize: none; font: inherit; font-size: 17px; line-height: 1.55;
             padding: 14px 16px; border: 0; border-radius: 16px 16px 0 0; background: transparent; color: var(--text); }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 12px 12px 16px; border-top: 1px solid var(--line); }
  .tags { flex: 1 1 220px; margin: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .tags code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: #333; padding: 2px 7px; border-radius: 6px; }
  .actions { display: flex; gap: 8px; margin-left: auto; }
  .actions button { padding: 10px 20px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); background: transparent; }
  #speak { background: var(--accent); border-color: var(--accent); color: #1d1d1d; }
  /* Kiosk controls. Sizes follow the screen width (cqw); 1cqw is 10.8px on a 1080px kiosk screen.
     Waiting: a welcome and one big button per language (a tap starts the chat in that language).
     In a chat: the state with its icon, a few questions to tap, and a quiet End button. */
  .panel .welcome, .panel .live { display: flex; flex-direction: column; gap: 2cqw; }
  .panel .welcome { gap: 4.4cqw; }
  .panel[data-state="waiting"] .live, .panel:not([data-state="waiting"]) .welcome { display: none; }
  .hello { margin: 0; text-align: center; font-size: 6.4cqw; font-weight: 800; line-height: 1.15; }
  .hello small { display: block; margin-top: 1.2cqw; font-size: 3.4cqw; font-weight: 600; color: var(--muted); }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 3.4cqw; }
  .langs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqw;
                  min-height: max(72px, 23cqw); padding: 2cqw; border: 0; border-radius: 5cqw; color: #fff;
                  font-size: 5.6cqw; font-weight: 800; box-shadow: 0 1.2cqw 0 rgba(0,0,0,.2); transition: transform .1s, box-shadow .1s; }
  .langs button small { font-size: 3.2cqw; font-weight: 600; opacity: .9; }
  .langs button[data-lang="en"] { background: var(--sky); }
  .langs button[data-lang="id"] { background: var(--leaf); }
  .langs button:active { transform: translateY(.6cqw); box-shadow: 0 .4cqw 0 rgba(0,0,0,.18); }
  .state { align-self: center; display: inline-flex; align-items: center; gap: 2.2cqw; margin: 0; padding: 1.8cqw 4.4cqw 1.8cqw 3.4cqw;
           border-radius: 99px; font-size: 4.4cqw; font-weight: 700; background: #efe6d6; color: var(--text); }
  .state[data-state="listening"] { background: #dcefe2; color: #1f5a37; }
  .state[data-state="thinking"] { background: #fbecc0; color: #7a5a00; }
  .state[data-state="speaking"] { background: #dbe9f5; color: #1f4f7a; }
  /* The icon: a microphone while listening, three dots while thinking, sound bars while speaking. */
  .icon { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .7cqw; width: 6cqw; height: 6cqw; }
  .icon svg { display: none; width: 100%; height: 100%; }
  .icon i { width: 1.2cqw; height: 1.2cqw; border-radius: 99px; background: currentColor; }
  .state[data-state="listening"] .icon svg { display: block; }
  .state[data-state="listening"] .icon i { display: none; }
  .state[data-state="listening"] .icon::after { content: ""; position: absolute; inset: -1cqw; border-radius: 50%;
                                                border: .5cqw solid currentColor; animation: ring 1.6s ease-out infinite; }
  .state[data-state="thinking"] .icon i { animation: blink 1.2s ease-in-out infinite; }
  .state[data-state="speaking"] .icon i { height: 4.4cqw; animation: bar .9s ease-in-out infinite; }
  .icon i:nth-child(2) { animation-delay: .2s !important; }
  .icon i:nth-child(3) { animation-delay: .4s !important; }
  @keyframes ring { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes blink { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes bar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .icon i, .icon::after { animation: none !important; } }
  .asks { display: flex; flex-direction: column; gap: 1.2cqw; }
  .asks p { margin: 0; text-align: center; font-size: 3cqw; font-weight: 600; color: var(--muted); }
  .asks div { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.8cqw; }
  .asks button { min-height: max(48px, 8.4cqw); padding: 1.4cqw 3.4cqw; border: .3cqw solid var(--line); border-radius: 99px;
                 background: var(--panel); font-size: 3.4cqw; font-weight: 600; }
  .asks button:active { background: #f3ead9; }
  /* Terracotta like the flower pots: apart from the white question chips, but softer than an alarm red. */
  .end { align-self: center; min-height: max(48px, 9cqw); padding: 1.2cqw 6cqw; border: .45cqw solid #c47a5f; border-radius: 99px;
         background: #f4d8cc; color: #8a3a24; font-size: 3.6cqw; font-weight: 700; }
  .end:active { background: #ecc6b6; }
  /* While waiting, Wayan invites people over with a speech bubble, in both languages by turns. */
  .invite { position: absolute; left: 50%; top: 13%; translate: -50% 0; max-width: 80%; padding: .6em 1.1em;
            border-radius: 1.2em; background: #fff; color: var(--text); font-size: clamp(15px, 4.6cqw, 60px); font-weight: 800;
            text-align: center; box-shadow: 0 .8cqw 2cqw rgba(0,0,0,.15); transition: opacity .4s; }
  .invite::after { content: ""; position: absolute; left: 50%; bottom: -.9em; translate: -50% 0; border: .5em solid transparent;
                   border-top: .55em solid #fff; }
  .invite[hidden] { display: block; opacity: 0; pointer-events: none; }
  .typing { display: flex; gap: 8px; }
  .typing[hidden] { display: none; }
  .typing input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                  background: var(--panel); color: var(--text); }
  .typing button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: transparent; }
  /* Problems show at the top of the stage, over the sky: the panel below is full during a chat. */
  .status { position: absolute; left: 50%; top: 4%; translate: -50% 0; width: max-content; max-width: 86%; margin: 0;
            padding: .4em .9em; border-radius: 1em; background: rgba(20,20,20,.7); color: #fff;
            font-size: clamp(13px, 3cqw, 34px); font-weight: 600; line-height: 1.35; text-align: center; }
  .status:empty { display: none; }
  .status.error { background: rgba(138,58,36,.9); }
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="scene" aria-hidden="true">
      <div class="track t1"><div class="cloud"></div></div>
      <div class="track t2"><div class="cloud"></div></div>
      <div class="track t3"><div class="cloud"></div></div>
      <div class="layer back"></div>
      <div class="tree-box"><div class="tree"></div></div>
      <div class="layer front"></div>
      <div class="plant l"></div>
      <div class="plant m"></div>
      <div class="plant r"></div>
      <div class="layer pots"></div>
    </div>
    <div class="shadow"></div>
    <canvas id="c" width="840" height="1260"></canvas>
    <div class="subtitle" id="subtitle" aria-hidden="true"></div>
    <div class="subtitle guest" id="heard" aria-hidden="true"></div>
    <p class="invite" id="invite">Hi! Come and talk to me</p>
    <p class="status" id="status" role="status"></p>
  </div>

  <div class="panel" id="panel" data-state="waiting">
    <div class="welcome">
      <p class="hello">Talk with Wayan<small>Ngobrol dengan Wayan · pick a language / pilih bahasa</small></p>
      <div class="langs" id="langs">
        <button type="button" data-lang="en">English<small>Tap to talk</small></button>
        <button type="button" data-lang="id">Indonesia<small>Sentuh untuk ngobrol</small></button>
      </div>
    </div>
    <div class="live">
      <p class="state" id="state" data-state="waiting" role="status" aria-live="polite">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg><i></i><i></i><i></i>
        </span>
        <span id="stateText"></span>
      </p>
      <div class="asks"><p id="asksLabel"></p><div id="asks"></div></div>
      <button type="button" class="end" id="end"></button>
    </div>
    <form class="typing" id="typing" hidden>
      <input id="typed" autocomplete="off" placeholder="Type what a guest would say (testing)" aria-label="Guest's words">
      <button>Send</button>
    </form>
  </div>
</main>

<script src="https://unpkg.com/@rive-app/canvas@2.44.0"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
  // ---- Voices ---------------------------------------------------------------
  // Brian, picked by Rozi from the male English Dragon HD voices Azure lists for this region.
  // He reads [laughter] in any language and picks the emotion up from the text itself.
  //     Emotion markers ([happy], [surprised]) are deliberately not sent: they stretched
  //     the words next to them ("Hi" 280 -> 600 ms, "Bali" 200 -> 400 ms with odd vowels).
  //     <prosody> is ignored by HD voices, so there is no pitch setting.
  // Dragon HD temperature (0-1): lower is steadier, higher varies more per take.
  // Pinned at 1, Azure's documented default, which Rozi picked.
  // Ardi is the only male Indonesian Dragon HD voice Azure lists for this region; his visemes
  // were checked in the avatar repo. He reports few word positions (see resolveTags).
  const VOICES = {
    en: { id: "en-US-Brian:DragonHDLatestNeural", lang: "en-US", hd: true },
    id: { id: "id-ID-Ardi:DragonHDLatestNeural", lang: "id-ID", hd: true },
  };
  const TEMPERATURE = 1;

  // Tag -> FaceVM.expression, or a gesture. Only [ketawa] also changes the audio (an HD laugh).
  const TAGS = {
    netral: { expr: 0 }, neutral: { expr: 0 },
    senyum: { expr: 1 }, smile: { expr: 1 },
    kaget:  { expr: 2 }, surprised: { expr: 2 },
    sedih:  { expr: 3 }, sad: { expr: 3 },
    ketawa: { expr: 4, laugh: true }, laugh: { expr: 4, laugh: true },
    jempol: { expr: 1, gesture: "jempol" }, thumbsup: { expr: 1, gesture: "jempol" },
    salam: { expr: 1, gesture: "salam" },
  };

  // ---- Rive -----------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  let vm = null;
  const rive_ = new rive.Rive({
    src: "wayan.riv",
    canvas: $("c"),
    stateMachine: "State Machine 1",
    autoplay: true,
    autoBind: true,
    onLoad: () => { rive_.resizeDrawingSurfaceToCanvas(); vm = rive_.viewModelInstance; greetWhenVisible(); },
    onLoadError: () => setStatus("Couldn't load wayan.riv. Open the page through the backend, not as a file.", true),
  });
  const setNum = (name, v) => { if (vm) vm.number(name).value = v; if (name === "expression") showExpr(v); };
  const setTalking = (on) => { if (vm) vm.boolean("talking").value = on; };

  // Gestures on the Aksi layer: FaceVM.action picks the timeline, 0 returns to rest.
  // Om Swastiastu plays once when Wayan first appears and again with the [salam] that
  // opens every greeting; the thumbs-up comes from a [jempol] tag in the text; the udeng slipping and being pushed back up fills the
  // idle time. The free Rive runtime shows a black splash for a few seconds after
  // loading, so the greeting waits until sampled canvas pixels stop being opaque black.
  const GESTURES = {
    salam: { action: 1, ms: 2000 },
    jempol: { action: 2, ms: 1800, cheer: true },
    udeng: { action: 3, ms: 2800, begin: udengLook },
  };
  const gesture = { timers: [], holdHead: false };
  function greetWhenVisible() {
    const ctx = $("c").getContext("2d");
    const { width: w, height: h } = $("c");
    const spots = [[0.1, 0.1], [0.9, 0.1], [0.1, 0.9], [0.9, 0.9], [0.5, 0.95]];
    const black = () => spots.every(([fx, fy]) => {
      const [r, g, b, a] = ctx.getImageData(Math.floor(w * fx), Math.floor(h * fy), 1, 1).data;
      return a > 200 && r + g + b < 30;
    });
    let seen = false;
    const started = performance.now();
    const poll = setInterval(() => {
      if (black()) { seen = true; return; }
      if (!seen && performance.now() - started < 3000) return; // splash not drawn yet (none on paid plans)
      clearInterval(poll);
      gesture.timers.push(setTimeout(playGreeting, 600));
    }, 150);
  }
  function playGreeting() {
    if (session && !session.done) return; // already talking
    playGesture("salam", () => setNum("expression", picked.expr));
    gesture.timers.push(setTimeout(() => setNum("expression", 1), 450)); // smile into the bow
  }
  // The state machine only leaves A_Rest, so a gesture that is still playing goes
  // back to rest for a moment before the next one starts.
  function playGesture(name, onEnd) {
    const busy = gesture.timers.length > 0;
    endGesture();
    const { action, ms, cheer: cheers, begin } = GESTURES[name];
    const start = () => {
      setNum("action", action);
      if (cheers) cheer();
      if (begin) begin();
      gesture.timers.push(setTimeout(() => { endGesture(); if (onEnd) onEnd(); }, ms));
    };
    if (busy) gesture.timers.push(setTimeout(start, 50));
    else start();
  }
  function endGesture() {
    gesture.timers.forEach(clearTimeout);
    gesture.timers = [];
    gesture.holdHead = false;
    setNum("action", 0);
  }

  // A_Udeng (scripts/udeng_keys.py, 60 fps): the udeng slips over f0-30 and lands by f48,
  // the hand is on it at f84, pushes it up over f96-116 and it settles at f140. The head
  // stays straight meanwhile (the hand is drawn for a straight head); the eyes go up to
  // the udeng, blink as it lands, and come back with a smile once it is fixed.
  function udengLook() {
    gesture.holdHead = true;
    idle.stops = [];
    idle.until = performance.now() + 3200;
    const at = (ms, fn) => gesture.timers.push(setTimeout(fn, ms));
    at(200, () => lookAt(-0.35, -0.75, performance.now()));
    at(520, () => vm && vm.trigger("blink").trigger());
    at(1950, () => { lookAt(0, 0, performance.now()); setNum("expression", 1); });
  }
  // Idle: every 4-8 s of quiet, the udeng slips. Not while he talks, plays another
  // gesture or follows the cursor.
  const quietGap = () => 4000 + Math.random() * 4000;
  function udengLoop(delay) {
    setTimeout(() => {
      const now = performance.now();
      const quiet = !(session && !session.done) && gesture.timers.length === 0
        && !(cursor.inside && now - cursor.movedAt < 3000) && !document.hidden && !calm.matches;
      if (!quiet) return udengLoop(quietGap());
      playGesture("udeng", () => setNum("expression", picked.expr));
      udengLoop(GESTURES.udeng.ms + quietGap());
    }, delay);
  }
  udengLoop(quietGap());

  // The courtyard joins in: a blossom drifts off the frangipani now and then, and a thumbs-up
  // kicks the tree, shakes a few blossoms loose and squashes the shadow with Wayan's bounce.
  const calm = matchMedia("(prefers-reduced-motion: reduce)");
  const PIC_W = 1331;                                   // picture units, as in scripts/bg_layers.py
  function dropBlossom(quick) {
    if (calm.matches) return;
    const scene = document.querySelector(".scene");
    const el = document.createElement("div");
    el.className = "blossom";
    scene.append(el);
    const u = scene.clientWidth / PIC_W, half = el.offsetWidth / 2;
    const side = () => (Math.random() < 0.5 ? -1 : 1);
    const x0 = 180 + Math.random() * 180, y0 = 640 + Math.random() * 70;     // under the canopy
    const x1 = 260 + Math.random() * 140, y1 = 1800 + Math.random() * 80;    // floor, clear of his feet
    const sway = (30 + Math.random() * 25) * side(), spin = (160 + Math.random() * 160) * side();
    const fall = quick ? 3400 : 6500, rest = 1400, end = fall / (fall + rest);
    const at = (x, y, r, sy) => `translate(${x * u - half}px, ${y * u - half}px) scale(1, ${sy}) rotate(${r}deg)`;
    const frames = [];
    for (let k = 0; k <= 30; k++) {
      const s = k / 30, ease = s * s * (3 - 2 * s);
      frames.push({ offset: s * end, opacity: Math.min(1, k / 3),
        transform: at(x0 + (x1 - x0) * s + sway * Math.sin(s * Math.PI * 3), y0 + (y1 - y0) * ease, spin * s, 1) });
    }
    const flat = at(x1, y1, spin, 0.6);                 // lies down on the floor, then fades
    frames.push({ offset: end + (1 - end) * 0.15, opacity: 1, transform: flat }, { offset: 1, opacity: 0, transform: flat });
    el.animate(frames, { duration: fall + rest, easing: "linear" }).onfinish = () => el.remove();
  }
  (function blossomLoop() {
    setTimeout(() => { if (!document.hidden) dropBlossom(false); blossomLoop(); }, 8000 + Math.random() * 4000);
  })();

  // Shadow width follows BODY_SY in scripts/jempol_keys.py (frame: body scale-y %), at 60 fps.
  const JEMPOL_BODY_SY = [[0, 100], [6, 98.6], [16, 101.8], [24, 99.3], [32, 100.4], [38, 100], [70, 100],
                          [82, 99.2], [92, 100.8], [100, 100], [108, 100]];
  function cheer() {
    if (calm.matches) return;
    document.querySelector(".shadow").animate(
      JEMPOL_BODY_SY.map(([f, sy]) => ({ offset: f / 108, scale: `${1 + (100 - sy) * 0.015} 1`, easing: "ease-in-out" })),
      { duration: 1800 });
    // The thumb pops at frames 15-19; the tree takes the kick then and rings down.
    gesture.timers.push(setTimeout(() => {
      document.querySelector(".tree-box").animate(
        [0, 2.2, -1.6, 1, -0.5, 0].map(r => ({ transform: `rotate(${r}deg)`, easing: "ease-in-out" })),
        { duration: 1600 });
      [0, 180, 380].forEach(ms => setTimeout(() => dropBlossom(true), ms));
    }, 280));
  }

  // Gaze, modelled on how people look around:
  // - the eyes jump (saccade) to a new point in 40-160 ms depending on distance,
  //   or follow a moving cursor smoothly (pursuit);
  // - the head follows on a slower spring, and as it turns the eyes ease back
  //   toward the middle, so the head does part of the work;
  // - while holding a point the eyes make tiny micro-saccades;
  // - big jumps usually come with a blink.
  // The cursor wins while it moves over the page. While talking he looks at you.
  // Otherwise he idles: glances somewhere, holds, looks back, rests.
  const clamp1 = (v) => Math.max(-1, Math.min(1, v));
  const target = { x: 0, y: 0 };
  const eye = { x: 0, y: 0, fromX: 0, fromY: 0, toX: 0, toY: 0, t0: 0, dur: 0, pursuit: false };
  const head = { x: 0, y: 0, vx: 0, vy: 0 };
  const cursor = { inside: false, movedAt: -Infinity };
  const idle = { until: 0, stops: [], last: -1, microAt: 0 };
  const HEAD_SHARE = 1;    // how far the head turns toward what he looks at (the layered head turns up to 1)
  const EYE_RETURN = 0.35; // how much the eyes recentre once the head has turned
  const HEAD_SPRING = 8;   // rad/s; the head settles in about 0.6 s
  const HEAD_DAMPING = 0.75; // below 1 the head overshoots ~1% and settles back, like a real neck

  // Start a saccade. A micro-saccade jitters the eyes without moving the target,
  // so the head stays put.
  function lookAt(x, y, now, micro = false) {
    const dist = Math.hypot(x - eye.x, y - eye.y);
    if (!micro) { target.x = x; target.y = y; }
    if (dist < 0.005) return;
    Object.assign(eye, { fromX: eye.x, fromY: eye.y, toX: x, toY: y, t0: now, dur: 40 + 80 * Math.min(dist, 1.5), pursuit: false });
    if (!micro && dist > 0.9 && Math.random() < 0.6 && vm) vm.trigger("blink").trigger();
  }

  window.addEventListener("pointermove", (e) => {
    const box = $("c").getBoundingClientRect();
    cursor.inside = true;
    cursor.movedAt = performance.now();
    target.x = clamp1((e.clientX - (box.left + box.width / 2)) / (box.width * 0.6));
    target.y = clamp1((e.clientY - (box.top + box.height * 0.3)) / (box.height * 0.5));
    eye.pursuit = true;
  });
  const cursorGone = () => {
    cursor.inside = false;
    cursor.movedAt = -Infinity;
    const now = performance.now();
    lookAt(0, 0, now); // back to the centre straight away, idle glances follow later
    idle.until = now + 2000;
    idle.stops = [];
  };
  document.addEventListener("pointerout", (e) => { if (!e.relatedTarget) cursorGone(); });
  window.addEventListener("blur", cursorGone);

  // Each glance is one or more [x, y] stops (y < 0 looks up), scaled 60-100%.
  const GLANCES = [
    [[-0.8, 0]], [[0.8, 0]],                      // side
    [[-0.7, -0.6]], [[0.7, -0.6]],                // up, as if thinking
    [[-0.6, 0.5]], [[0.6, 0.5]],                  // down
    [[-0.8, 0], [0.8, 0]], [[0.8, 0], [-0.8, 0]], // look around
  ];
  function idleGaze(now) {
    if (now < idle.until) return;
    let wait;
    if (idle.stops.length) {
      const [x, y] = idle.stops.shift();
      lookAt(x, y, now);
      wait = idle.stops.length ? 350 + Math.random() * 350 : 500 + Math.random() * 800; // hold
    } else if (target.x || target.y) {
      lookAt(0, 0, now);
      wait = 1800 + Math.random() * 2700; // rest at the centre
    } else {
      let i;
      do { i = Math.floor(Math.random() * GLANCES.length); } while (i === idle.last);
      idle.last = i;
      const s = 0.6 + Math.random() * 0.4;
      idle.stops = GLANCES[i].map(([x, y]) => [x * s, y * s]);
      wait = 0;
    }
    idle.until = now + wait;
  }

  let lastFrame = performance.now();
  function gazeFrame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const talking = session && session.started && !session.done;
    if (cursor.inside && now - cursor.movedAt < 3000) {
      idle.until = now + 1500; // after the cursor stops, wait a little before idling
      idle.stops = [];
    } else {
      eye.pursuit = false;
      if (talking) {
        if (target.x || target.y) lookAt(0, 0, now);
        idle.until = now + 1500;
        idle.stops = [];
      } else {
        idleGaze(now);
      }
      if (now > idle.microAt && now - eye.t0 > eye.dur + 250) {
        lookAt(target.x + (Math.random() - 0.5) * 0.12, target.y + (Math.random() - 0.5) * 0.1, now, true);
        idle.microAt = now + 500 + Math.random() * 900;
      }
    }

    if (eye.pursuit) {
      const k = 1 - Math.exp(-dt / 0.07); // smooth pursuit, ~70 ms behind the cursor
      eye.x += (target.x - eye.x) * k;
      eye.y += (target.y - eye.y) * k;
    } else {
      const p = eye.dur ? Math.min(1, (now - eye.t0) / eye.dur) : 1;
      const e = 1 - (1 - p) ** 3; // fast start, soft landing
      eye.x = eye.fromX + (eye.toX - eye.fromX) * e;
      eye.y = eye.fromY + (eye.toY - eye.fromY) * e;
    }

    // Damped spring: the head lags the eyes and settles with a barely visible overshoot.
    for (const [k, v] of [["x", "vx"], ["y", "vy"]]) {
      const goal = gesture.holdHead ? 0 : target[k] * HEAD_SHARE;
      const a = HEAD_SPRING ** 2 * (goal - head[k]) - 2 * HEAD_DAMPING * HEAD_SPRING * head[v];
      head[v] += a * dt;
      head[k] += head[v] * dt;
    }

    setNum("lookX", clamp1(eye.x - EYE_RETURN * head.x));
    setNum("lookY", clamp1(eye.y - EYE_RETURN * head.y));
    setNum("headX", head.x);
    setNum("headY", head.y);
    requestAnimationFrame(gazeFrame);
  }
  requestAnimationFrame(gazeFrame); // first frame runs after the script, once `session` exists

  // ---- UI -------------------------------------------------------------------
  const setStatus = (msg, isError = false) => {
    $("status").textContent = msg;
    $("status").className = "status" + (isError ? " error" : "");
    delete $("status").dataset.mic;
  };
  // A microphone problem lasts the whole chat, so Wayan starting to speak doesn't clear it.
  const setMicProblem = (msg) => { setStatus(msg, true); $("status").dataset.mic = "1"; };
  // English HD voices can switch accent mid-sentence with <lang>.
  const canLocalize = (v) => v.hd && v.lang.startsWith("en");

  // ---- SSML with tag positions ---------------------------------------------
  const escapeXml = (s) => s.replace(/[<>&'"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[c]));

  // Indonesian names an American voice says with the wrong stress ("Bali", "Wayan").
  // The hotel's and Balinese words Wayan uses are added for the kiosk (Taman Gumitir onwards).
  const LOCAL_NAMES = /\b(Bali|Wayan|Made|Kadek|Nyoman|Komang|Ketut|Putu|Gede|Ubud|Denpasar|Kuta|Sanur|Nusa|udeng|kamen|Galungan|Nyepi|Taman|Gumitir|Swastiastu|suksma|Suksma|Rahajeng|rauh|semeng|Kenken|kabare|becik|Sudana|Sekar|Arsa|Lestari|Rai|Nengah|Banjar|Usada|Warung|Sari|jepun|gumitir|betutu|canang|sari|Kuningan|Legong|Barong|Kecak|ogoh|subak|angkul|aling|natah|Asta|Kosala|Kosali|Tri|Hita|Karana|penjor|lawar|lilit|guling|jaje)\b/g;
  // HD voices guess the language per sentence and read a lone "Hi!" as Indonesian "hii",
  // so English text is pinned to the voice's language and only the names switch.
  const inLang = (lang, s) => s.replace(/^(\s*)([\s\S]*?)(\s*)$/,
    (_, a, body, z) => body ? `${a}<lang xml:lang="${lang}">${body}</lang>${z}` : a + z);
  const localize = (text, voice) => {
    if (!canLocalize(voice)) return text;
    return text.split(LOCAL_NAMES).map((s, i) => inLang(i % 2 ? "id-ID" : voice.lang, s)).join("");
  };

  // Returns the SSML and, for each known tag and each word of the subtitle, where it sits in the
  // SSML string. Azure's wordBoundary.textOffset indexes that same string, which is how both meet audio time.
  function buildSsml(raw, voice) {
    const head = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" ` +
      `xmlns:mstts="https://www.w3.org/2001/mstts" xml:lang="${voice.lang}"><voice name="${voice.id}" parameters="temperature=${TEMPERATURE}">`;
    const tail = "</voice></speak>";
    let body = "";
    let plain = 0; // length of spoken text so far, for voices that send no word positions
    const tags = [], words = [];
    for (const part of raw.split(/(\[[^\]]*\])/)) {
      const m = part.match(/^\[([^\]]*)\]$/);
      if (!m) {
        const piece = localize(escapeXml(part), voice);
        // <lang> can split a word ("Bali." becomes Bali + "."), so look for its letters only.
        let from = 0;
        for (const text of part.match(/\S+/g) || []) {
          const core = escapeXml(text.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""));
          let at = core ? piece.indexOf(core, from) : -1;
          if (at < 0 && core) at = piece.indexOf(core.match(/^[\p{L}\p{N}]*/u)[0], from);
          if (at >= 0) from = at + 1;
          words.push({ text, ssml: head.length + body.length + (at >= 0 ? at : from) });
        }
        body += piece;
        plain += part.length;
        continue;
      }
      const tag = TAGS[m[1].trim().toLowerCase()];
      if (!tag) continue; // unknown tags are dropped, never spoken
      const before = head.length + body.length;
      const leading = body.trim() === "";
      if (voice.hd && tag.laugh) body += " [laughter] ";
      tags.push({ ...tag, before, leading, plainAt: plain });
    }
    tags.forEach((t) => (t.plainFrac = plain ? t.plainAt / plain : 0));
    return { ssml: head + body + tail, tags, words: chunkWords(words) };
  }

  // ---- Subtitle -------------------------------------------------------------
  // The subtitle shows one sentence at a time and the words light up as they are
  // heard. A short sentence ("Hi!") shares the line with the next one; a long one is
  // cut into even pieces of one line, at a comma where one is close.
  const SUB_CHARS = 42;
  const SUB_SHORT = 24;
  const sentenceEnd = (w) => /[.!?…]["'”’)]*$/.test(w);
  const lineLength = (ws) => ws.reduce((n, w) => n + w.text.length + 1, -1);
  function chunkWords(words) {
    const sentences = [[]];
    words.forEach((w, i) => { sentences[sentences.length - 1].push(w); if (sentenceEnd(w.text) && i < words.length - 1) sentences.push([]); });
    const groups = [];
    for (const sent of sentences) {
      const prev = groups[groups.length - 1];
      if (prev && lineLength(prev) < SUB_SHORT && lineLength(prev) + 1 + lineLength(sent) <= SUB_CHARS) prev.push(...sent);
      else groups.push(sent);
    }
    let chunk = 0;
    for (const group of groups) {
      const total = lineLength(group);
      const step = total / Math.ceil(total / SUB_CHARS);
      let len = -1, cut = step;
      group.forEach((w, i) => {
        w.chunk = chunk;
        len += w.text.length + 1;
        const next = group[i + 1];
        if (!next || total <= SUB_CHARS || len < cut - 12) return;
        // Break at a comma within 12 characters of an even cut, else at the word end closest to it.
        if (/,$/.test(w.text) || len + 1 + next.text.length - cut > cut - len) { chunk++; cut = len + step; }
      });
      chunk++;
    }
    return words;
  }

  // When each subtitle word is heard. Azure's word time is used, except that HD voices
  // report some words early, inside the pause before them; such a word is moved to
  // where the sound resumes. Words Azure does not report light up with the next one.
  function timeWords(s) {
    const subs = s.subWords;
    for (const w of wordsWithOffsets(s)) {
      let i = -1;
      subs.forEach((x, j) => { if (x.ssml <= w.off) i = j; });
      if (i < 0 || subs[i].at !== undefined) continue;
      if (!s.synthDone && s.receivedMs < w.ms + 1500) break; // audio after it not measured yet
      let at = w.ms;
      if (!loudAt(s, at)) {
        for (let t = at; t <= w.ms + 1500; t += FRAME_MS) if (loudAt(s, t)) { at = t; break; }
      }
      subs[i].at = at;
    }
  }

  function showSubtitle(s, t) {
    if (t < 0 || !s.subWords.length) return;
    timeWords(s);
    let lit = -1;
    s.subWords.forEach((w, i) => { if (w.at !== undefined && w.at <= t) lit = i; });
    renderSubtitle(s, lit);
  }

  function renderSubtitle(s, lit) {
    const chunk = lit < 0 ? 0 : s.subWords[lit].chunk;
    if (s.sub && s.sub.chunk === chunk && s.sub.lit === lit) return;
    s.sub = { chunk, lit };
    const said = [], later = [];
    s.subWords.forEach((w, i) => { if (w.chunk === chunk) (i <= lit ? said : later).push(w.text); });
    const el = $("subtitle");
    el.replaceChildren();
    if (said.length) el.append(said.join(" "));
    if (said.length && later.length) el.append(" ");
    if (later.length) { const span = document.createElement("span"); span.className = "later"; span.textContent = later.join(" "); el.append(span); }
    hideHeard();
    el.classList.add("on");
  }

  const hideSubtitle = () => $("subtitle").classList.remove("on");

  // ---- Speaking -------------------------------------------------------------
  // Azure's visemes and word times are estimates. On HD voices they keep the
  // mouth open into silences, report some words up to a second early, and put
  // the laugh on the word before the actual laugh. So the page plays the audio
  // itself (Web Audio) and measures its loudness every 10 ms. Synthesis runs
  // about 3x faster than playback, so the loudness of what is about to be
  // heard is always known in advance:
  // - the mouth is closed whenever the audio is silent,
  // - expressions switch inside the silence just before the next word starts,
  // - the laugh face covers the laugh that is actually heard.
  const RATE = 24000;
  const FRAME_MS = 10;
  const FRAME = RATE * FRAME_MS / 1000;
  const SILENT = 150;  // RMS of 16-bit PCM: measured pauses stay under 70, quiet speech is 300+
  const LEAD_S = 0.25; // audio buffered before playback starts
  let session = null;
  let ctx = null;

  // Speaks one piece of text and resolves when Wayan has finished or was stopped.
  async function speak(text, voice = VOICES.en) {
    stop();
    endGesture();
    hideSubtitle();
    const raw = (text || "").trim();
    if (!raw) return;
    // Created inside the click, otherwise the browser refuses to play it.
    ctx = ctx || new AudioContext();
    ctx.resume();

    let auth;
    try {
      const res = await fetch("/api/speech-token");
      auth = await res.json();
      if (!res.ok) throw new Error(auth.error || res.statusText);
    } catch (err) {
      setStatus("Speech token failed: " + err.message, true);
      return;
    }

    const sdk = SpeechSDK;
    const config = sdk.SpeechConfig.fromAuthorizationToken(auth.token, auth.region);
    config.speechSynthesisOutputFormat = sdk.SpeechSynthesisOutputFormat.Raw24Khz16BitMonoPcm;
    const synth = new sdk.SpeechSynthesizer(config, null); // no SDK playback: the page plays it
    const { ssml, tags, words } = buildSsml(raw, voice);

    const s = session = {
      synth, tags, subWords: words, sub: null, visemes: [], words: [], events: [], env: [], sources: [],
      pending: [], oddByte: null, receivedMs: 0, synthDone: false, totalMs: 0,
      started: false, startAt: 0, nextAt: 0, done: false, laughing: false, expr: 0,
    };
    const finished = new Promise((resolve) => (s.resolve = resolve));

    synth.visemeReceived = (_, e) => s.visemes.push({ ms: e.audioOffset / 1e4, id: e.visemeId });
    const WORD = sdk.SpeechSynthesisBoundaryType && sdk.SpeechSynthesisBoundaryType.Word;
    synth.wordBoundary = (_, e) => {
      if (WORD !== undefined && e.boundaryType !== undefined && e.boundaryType !== WORD) return;
      s.words.push({ ms: e.audioOffset / 1e4, dur: (e.duration || 0) / 1e4, off: e.textOffset });
    };
    synth.synthesizing = (_, e) => { if (session === s && !s.done) addAudio(s, e.result.audioData); };

    synth.speakSsmlAsync(ssml, (result) => {
      s.synthDone = true;
      s.totalMs = s.receivedMs;
      if (result.reason !== sdk.ResultReason.SynthesizingAudioCompleted) {
        setStatus("Azure speech failed: " + (result.errorDetails || result.reason), true);
        finish(s);
      } else if (s.visemes.length === 0) {
        setStatus("This voice sends no visemes, so the mouth can't move.", true);
      }
      synth.close();
    }, (err) => { setStatus("Azure speech failed: " + err, true); finish(s); });
    return finished;
  }

  // Queue one chunk of raw PCM right after the previous one and measure its loudness.
  function addAudio(s, buffer) {
    let bytes = new Uint8Array(buffer);
    if (s.oddByte) { const b = new Uint8Array(bytes.length + 1); b[0] = s.oddByte[0]; b.set(bytes, 1); bytes = b; s.oddByte = null; }
    if (bytes.length % 2) { s.oddByte = bytes.slice(-1); bytes = bytes.slice(0, -1); }
    if (!bytes.length) return;
    const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.length / 2);

    for (const v of pcm) {
      s.pending.push(v);
      if (s.pending.length === FRAME) {
        s.env.push(Math.sqrt(s.pending.reduce((sum, x) => sum + x * x, 0) / FRAME));
        s.pending = [];
      }
    }

    const audio = ctx.createBuffer(1, pcm.length, RATE);
    audio.getChannelData(0).set(Float32Array.from(pcm, (x) => x / 32768));
    const src = ctx.createBufferSource();
    src.buffer = audio;
    src.connect(ctx.destination);
    const now = ctx.currentTime;
    if (!s.started) {
      s.started = true;
      s.startAt = s.nextAt = now + LEAD_S;
      if (!$("status").dataset.mic) setStatus("");
      firstSound();
      requestAnimationFrame(() => frame(s));
    } else if (s.nextAt < now + 0.02) {
      // The network fell behind playback: resume a moment later and shift the clock with it.
      const late = now + 0.05 - s.nextAt;
      s.startAt += late;
      s.nextAt += late;
    }
    src.start(s.nextAt);
    s.nextAt += audio.duration;
    s.sources.push(src);
    s.receivedMs += pcm.length / RATE * 1000;
  }

  // Milliseconds into the speech that is leaving the speakers right now.
  function audioNow(s) {
    const ts = ctx.getOutputTimestamp && ctx.getOutputTimestamp();
    const at = ts && ts.contextTime > 0 ? ts.contextTime : ctx.currentTime - (ctx.outputLatency || 0);
    return (at - s.startAt) * 1000;
  }

  const loudAt = (s, ms) => (s.env[Math.floor(ms / FRAME_MS)] || 0) > SILENT;
  const loudNear = (s, ms, span) => {
    for (let t = ms - span; t <= ms + span; t += FRAME_MS) if (loudAt(s, t)) return true;
    return false;
  };

  // Silent stretches of at least minMs in the audio measured so far.
  function silences(s, minMs) {
    const out = [];
    let start = null;
    s.env.forEach((e, i) => {
      if (e <= SILENT) { if (start === null) start = i * FRAME_MS; return; }
      if (start !== null && i * FRAME_MS - start >= minMs) out.push({ start, end: i * FRAME_MS });
      start = null;
    });
    if (start !== null && s.synthDone && s.env.length * FRAME_MS - start >= minMs) out.push({ start, end: s.env.length * FRAME_MS });
    return out;
  }

  // Stretches where Azure gives no mouth shape (viseme 0), merged.
  function shapelessRuns(s) {
    const runs = [];
    s.visemes.forEach((v, i) => {
      if (v.id !== 0) return;
      const end = s.visemes[i + 1] ? s.visemes[i + 1].ms : s.receivedMs;
      const prev = runs[runs.length - 1];
      if (prev && Math.abs(prev.end - v.ms) < 1) prev.end = end;
      else runs.push({ start: v.ms, end });
    });
    return runs;
  }

  // Azure sends offset -1 for some words (the first one, the one after [laughter]
  // inside <lang>). Such a word sits just before the next word with a real offset;
  // until that word arrives its offset stays unknown (NaN matches no tag).
  function wordsWithOffsets(s) {
    let nextOff = s.synthDone ? Infinity : NaN;
    return s.words.slice().reverse().map((w) => {
      if (w.off >= 0) { nextOff = w.off; return w; }
      return { ...w, off: nextOff - 1 };
    }).reverse();
  }

  // Turn tags into timed face changes. Where a tag lands is first estimated from
  // the word after it (or, for voices that report few words such as id-ID-Ardi
  // HD, from its share of the text), then corrected against the measured audio.
  function resolveTags(s) {
    const words = wordsWithOffsets(s);
    for (const tag of s.tags) {
      if (tag.done) continue;
      if (tag.leading && !tag.laugh) {
        // The opening face is already on before the first sound.
        tag.done = true;
        s.events.push({ ms: -Infinity, run: () => applyTag(s, tag) });
        continue;
      }
      let target;
      const next = words.find((w) => w.off >= tag.before);
      if (next) target = next.ms;
      else if (s.synthDone) target = guessFromText(s, tag);
      else continue;
      if (!s.synthDone && s.receivedMs < target + 1200) continue; // audio around it not measured yet
      tag.done = true;
      if (tag.laugh) placeLaugh(s, target);
      else placeTag(s, tag, target);
    }
    s.events.sort((a, b) => a.ms - b.ms);
  }

  // Long pauses are laughs and hold no text, so they are left out of the proportion.
  function guessFromText(s, tag) {
    const long = silences(s, 700);
    let guess = tag.plainFrac * (s.totalMs - long.reduce((sum, p) => sum + p.end - p.start, 0));
    for (const p of long) if (p.start <= guess) guess += p.end - p.start;
    return guess;
  }

  // Switch inside a silence near the estimate, just before the sound resumes, so
  // the new face never lands on the end of the previous words. Tags open sentences,
  // so a long pause beats a closer comma pause.
  function placeExpr(s, expr, target) {
    return placeTag(s, { expr }, target);
  }
  function placeTag(s, tag, target) {
    const dist = (p) => (target < p.start ? p.start - target : target > p.end ? target - p.end : 0);
    const score = (p) => (p.end - p.start) - dist(p) / 2;
    const gap = silences(s, 100).filter((p) => dist(p) <= 1000)
      .reduce((best, p) => (!best || score(p) > score(best) ? p : best), null);
    const at = gap ? Math.max(gap.start, gap.end - 120) : Math.max(0, target - 60);
    s.events.push({ ms: at, run: () => applyTag(s, tag) });
    return at;
  }

  // Bursts of sound in the audio measured so far; gaps up to 100 ms are bridged.
  function sounds(s) {
    const out = [];
    let cur = null;
    s.env.forEach((e, i) => {
      if (e <= SILENT) return;
      const t = i * FRAME_MS;
      if (cur && t - cur.end <= 100) cur.end = t + FRAME_MS;
      else out.push(cur = { start: t, end: t + FRAME_MS });
    });
    return out;
  }

  // The heard laugh: bursts of sound that are mostly inside long stretches with no
  // mouth shapes. Near the word after [laughter], take the biggest group of them,
  // and end the laugh face before the next words start.
  function placeLaugh(s, target) {
    const runs = shapelessRuns(s).filter((r) => r.end - r.start >= 300);
    const all = sounds(s);
    const bursts = all.filter((g) => {
      if (g.end < target - 2500 || g.start > target + 300) return false;
      let loud = 0, shapeless = 0;
      for (let ms = g.start; ms < g.end; ms += FRAME_MS) {
        if (!loudAt(s, ms)) continue;
        loud++;
        if (runs.some((r) => ms >= r.start && ms < r.end)) shapeless++;
      }
      g.n = shapeless;
      return loud && shapeless / loud >= 0.7;
    });
    const groups = [];
    for (const g of bursts) {
      const prev = groups[groups.length - 1];
      if (prev && g.start - prev.end <= 400) { prev.end = g.end; prev.n += g.n; }
      else groups.push({ ...g });
    }
    const laugh = groups.reduce((best, g) => (!best || g.n > best.n ? g : best), null);
    if (laugh && laugh.n >= 5) {
      const after = all.find((g) => g.start >= laugh.end);
      const end = Math.min(laugh.end + 120, after ? after.start - 30 : Infinity);
      // A laugh settles into a smile rather than snapping back to the previous face.
      s.events.push({ ms: laugh.start - 40, run: () => { s.laughing = true; applyExpr(s, 4); } });
      s.events.push({ ms: end, run: () => { s.laughing = false; applyExpr(s, 1); } });
    } else {
      // This voice did not laugh out loud: show the face in the pause, then smile.
      const at = placeExpr(s, 4, target);
      s.events.push({ ms: at + 800, run: () => applyExpr(s, 1) });
    }
  }

  const applyExpr = (s, e) => { s.expr = e; setNum("expression", e); };
  const applyTag = (s, tag) => { applyExpr(s, tag.expr); if (tag.gesture) playGesture(tag.gesture); };

  // Azure's shape at time t; where there is sound but no shape yet (shapes trail
  // the sound by ~100 ms at word starts) use the next shape, else the last one.
  function visemeFor(s, t) {
    let id = 0, last = 1;
    for (const v of s.visemes) { if (v.ms > t) break; id = v.id; if (v.id) last = v.id; }
    if (id) return id;
    const soon = s.visemes.find((v) => v.ms > t && v.ms <= t + 250 && v.id);
    return soon ? soon.id : last;
  }

  function frame(s) {
    if (s !== session || s.done) return;
    const t = audioNow(s);
    resolveTags(s);
    while (s.events.length && s.events[0].ms <= t) s.events.shift().run();
    showSubtitle(s, t);
    if (s.synthDone && t >= s.totalMs + 100) { finish(s); return; }
    let id = 0;
    if (t >= 0 && loudNear(s, t, 20)) id = s.laughing ? (Math.floor(t / 110) % 2 ? 2 : 1) : visemeFor(s, t);
    setNum("visemeId", id);
    setTalking(t >= 0 && !s.laughing && loudNear(s, t, 250));
    requestAnimationFrame(() => frame(s));
  }

  function finish(s) {
    if (s.done) return;
    s.done = true;
    s.events = [];
    s.laughing = false;
    setNum("visemeId", 0);
    setTalking(false);
    // The last line stays a moment, fully lit, then fades.
    if (s.sub && !s.stopped) renderSubtitle(s, s.subWords.length - 1);
    setTimeout(() => { if (session === s) hideSubtitle(); }, 1200);
    const ended = performance.now();
    setTimeout(() => {
      if (picked.at > ended) return; // a try-out button was pressed meanwhile
      if (session === s || !session || session.done) { picked.expr = 0; setNum("expression", 0); }
    }, 1500);
    s.resolve();
  }

  function stop() {
    if (!session || session.done) return;
    for (const src of session.sources) { try { src.stop(); } catch (_) {} }
    try { session.synth.close(); } catch (_) {}
    session.stopped = true;
    finish(session);
    hideSubtitle();
  }

  // ---- Try-out buttons ------------------------------------------------------
  // A face stays until another is picked. A gesture plays once with a smile, then
  // hands back the picked face. Any button stops speech first.
  const picked = { expr: 0, at: 0 };
  function showExpr(v) {
    document.querySelectorAll(".moves [data-expr]").forEach((b) => b.classList.toggle("on", +b.dataset.expr === v));
  }
  document.querySelectorAll(".moves button").forEach((b) => b.addEventListener("click", () => {
    stop();
    picked.at = performance.now();
    if (b.dataset.expr) {
      picked.expr = +b.dataset.expr;
      setNum("expression", picked.expr);
      return;
    }
    const name = b.dataset.gesture;
    playGesture(name, () => setNum("expression", picked.expr));
    if (name === "salam") gesture.timers.push(setTimeout(() => setNum("expression", 1), 450)); // smile into the bow
    else if (name === "jempol") setNum("expression", 1);
  }));

  // ---- Conversation (the kiosk) ----------------------------------------------
  // Start opens a session on the backend: Wayan greets first, then listens
  // hands-free (Azure speech-to-text). The guest's words go to the backend, which
  // streams Wayan's reply as checked sentences; they queue up and he speaks them
  // in order. Words recognised while he talks cut him off, but his own voice
  // coming back through the microphone doesn't. After 45 s of quiet he asks once,
  // after 60 s he says goodbye. Stop, a goodbye, or the silence ends the session.
  // The guest picks English or Indonesian before Start; the session keeps it to the end.
  // What the guest says shows in Wayan's subtitle spot while they say it.
  // Add ?type=1 to the address for a text box that stands in for the microphone.
  const IDLE_CHECK_MS = 45000, IDLE_END_MS = 60000;
  const HEARD_CHARS = 48;      // the guest's caption keeps to one line: the latest words
  const HEARD_LINGER_MS = 6000; // if no reply replaces it, a final caption fades after this
  const FILLER_MS = 2000; // a reply slower than this gets a filler line first, so the guest isn't left in silence
  // Names speech-to-text would otherwise mishear.
  const PHRASES = ["Wayan", "Taman Gumitir", "Gumitir", "Pak Bos", "Warung Sari", "Bale Usada", "Banjar Sekar",
    "frangipani", "Nyepi", "Galungan", "Kuningan", "canang sari", "bebek betutu", "babi guling", "subak", "gamelan",
    "udeng", "suksma", "Om Swastiastu", "ogoh-ogoh", "Kecak", "Legong", "Barong"];
  // Questions to tap instead of saying them: two about the hotel or Bali, one for fun.
  // Only questions; the answers still come from the knowledge. Kept short so any three
  // fit in two rows: a third row pushes End chat off a 1:2 screen.
  const UI = {
    en: {
      end: "✕  End chat", asks: "Try asking", typed: "Type what a guest would say (testing)", send: "Send",
      states: {
        waiting: "",
        starting: "Starting…",
        listening: "Go ahead, I'm listening",
        thinking: "Wayan is thinking…",
        speaking: "Wayan is talking",
      },
      facts: ["Breakfast time?", "Pool hours?", "Book a massage?", "What's canang sari?", "Things to do here?", "Wi-Fi?"],
      fun: ["Tell me a joke!", "A funny story!", "Give me a riddle!"],
    },
    id: {
      end: "✕  Selesai", asks: "Coba tanya", typed: "Ketik ucapan tamu (untuk tes)", send: "Kirim",
      states: {
        waiting: "",
        starting: "Memulai…",
        listening: "Silakan bicara, aku dengar",
        thinking: "Wayan sedang berpikir…",
        speaking: "Wayan sedang bicara",
      },
      facts: ["Jam sarapan?", "Jam kolam renang?", "Pesan pijat?", "Apa itu canang sari?", "Kegiatan di sini?", "Wi-Fi-nya?"],
      fun: ["Tebak-tebakan dong!", "Cerita lucu dong!", "Lelucon dong!"],
    },
  };
  const INVITES = ["Hi! Come and talk to me", "Hai! Ayo ngobrol sama aku"];
  const typing = new URLSearchParams(location.search).has("type");
  const convo = {
    id: null,          // session ID; null while waiting for Start
    language: "en",    // picked before Start: "en" or "id"
    errorLine: null,   // said when the backend can't be reached; the backend sends it in the session's language
    fillers: [],       // said while a slow reply is on its way; never part of the reply
    filler: false,     // the piece being spoken is a filler
    lastFiller: null,  // not said twice in a row
    fillerTimer: null,
    state: "waiting",
    turn: 0,           // bumped on every new guest message, cut-in or stop; stale work checks it
    queue: [],         // pieces of the reply received but not yet spoken
    heard: [],         // pieces of the current reply spoken in full
    current: "",       // the piece being spoken
    speaking: false,
    replyId: null,     // the reply's message_id, once `done` arrives
    replyDone: true,   // the backend has sent the whole reply
    endAfter: false,   // the reply ends the session once spoken
    cut: null,         // what the guest heard before cutting in; sent with the next message
    abort: null,
    recognizer: null,
    tokenTimer: null,
    idleTimer: null,
    idleChecked: false,
    sentAt: null,
    heardTimer: null,
  };
  window.kioskTimings = []; // seconds from the guest's last word to Wayan's first sound

  function setState(state) {
    const ui = UI[convo.language];
    // New questions each time Wayan has finished a reply, never under the guest's finger mid-turn.
    if (state === "listening" && convo.state === "speaking") showAsks();
    convo.state = state;
    $("stateText").textContent = ui.states[state];
    $("state").dataset.state = state;
    $("panel").dataset.state = state;
    $("invite").hidden = state !== "waiting";
  }

  function setLanguage(language) {
    const ui = UI[language];
    convo.language = language;
    document.documentElement.lang = language;
    $("end").textContent = ui.end;
    $("asksLabel").textContent = ui.asks;
    $("typed").placeholder = ui.typed;
    $("typing").querySelector("button").textContent = ui.send;
    setState(convo.state);
  }

  function showAsks() {
    const ui = UI[convo.language];
    const pick = (list, n) => [...list].sort(() => Math.random() - 0.5).slice(0, n);
    const asks = pick([...pick(ui.facts, 2), ...pick(ui.fun, 1)], 3);
    $("asks").replaceChildren(...asks.map((text) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.onclick = () => heardWords(text, true, true);
      return b;
    }));
    // A third row would push End chat off the screen (a narrower screen, a bigger font):
    // drop questions from the end until two rows are left.
    const rows = () => new Set([...$("asks").children].map((b) => b.offsetTop)).size;
    while ($("asks").children.length > 1 && rows() > 2) $("asks").lastElementChild.remove();
  }

  // The guest's words in the subtitle spot: grey while speech-to-text is still guessing,
  // white once it settles. Wayan's next subtitle takes the spot back (renderSubtitle).
  function showHeard(text, final) {
    const el = $("heard");
    let words = text.trim();
    if (words.length > HEARD_CHARS) {
      const cut = words.indexOf(" ", words.length - HEARD_CHARS);
      words = "…" + words.slice(cut < 0 ? words.length - HEARD_CHARS : cut + 1);
    }
    el.textContent = words;
    el.classList.toggle("interim", !final);
    hideSubtitle();
    el.classList.add("on");
    clearTimeout(convo.heardTimer);
    if (final) convo.heardTimer = setTimeout(hideHeard, HEARD_LINGER_MS);
  }
  function hideHeard() {
    clearTimeout(convo.heardTimer);
    $("heard").classList.remove("on");
  }

  function firstSound() {
    if (convo.sentAt === null) return;
    const seconds = (performance.now() - convo.sentAt) / 1000;
    convo.sentAt = null;
    window.kioskTimings.push(seconds);
    console.info(`[kiosk] Wayan started speaking ${seconds.toFixed(2)} s after the guest's words`);
  }

  // A short "hmm, let me think" while a slow reply is still on its way. It is not
  // part of the reply: not remembered as heard, and not sent back on a cut-in.
  async function sayFiller(turn) {
    if (turn !== convo.turn || convo.speaking || convo.queue.length || !convo.fillers.length) return;
    const pick = convo.fillers.filter((f) => f !== convo.lastFiller);
    const text = convo.lastFiller = pick[Math.floor(Math.random() * pick.length)];
    Object.assign(convo, { speaking: true, filler: true, current: text });
    setState("speaking");
    await speak(text, VOICES[convo.language]);
    if (turn !== convo.turn) return;
    Object.assign(convo, { speaking: false, filler: false, current: "" });
    if (convo.queue.length) return pump();
    if (convo.replyDone) replyFinished();
    else setState("thinking");
  }

  // Speaks queued pieces one after another; pieces that arrive meanwhile are joined.
  async function pump() {
    if (!convo.id || convo.speaking || !convo.queue.length) return;
    const turn = convo.turn;
    const text = convo.queue.splice(0).join(" ");
    convo.speaking = true;
    convo.current = text;
    clearIdle();
    setState("speaking");
    await speak(text, VOICES[convo.language]);
    if (turn !== convo.turn) return; // cut off or stopped: whoever did that moves on
    convo.speaking = false;
    convo.heard.push(text);
    convo.current = "";
    if (convo.queue.length) return pump();
    if (convo.replyDone) replyFinished();
  }

  function replyFinished() {
    if (convo.endAfter) return endLocally(); // the backend has already closed the session
    setState("listening");
    armIdle();
  }

  // Server-sent events from a fetch response, as [event, data] pairs.
  async function* readEvents(body) {
    const reader = body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buffer += value;
      for (let cut; (cut = buffer.indexOf("\n\n")) >= 0;) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = (block.match(/^data: (.*)$/m) || [])[1];
        if (event && data) yield [event, JSON.parse(data)];
      }
    }
  }

  async function send(text) {
    if (!convo.id) return;
    const turn = ++convo.turn;
    const body = { text };
    if (convo.cut) { body.interrupted = convo.cut; convo.cut = null; }
    Object.assign(convo, { queue: [], heard: [], current: "", speaking: false, replyId: null, replyDone: false, endAfter: false });
    clearIdle();
    setState("thinking");
    convo.sentAt = performance.now();
    clearTimeout(convo.fillerTimer);
    convo.fillerTimer = setTimeout(() => sayFiller(turn), FILLER_MS);
    const abort = convo.abort = new AbortController();
    try {
      const res = await fetch(`/sessions/${convo.id}/messages`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: abort.signal,
      });
      if (res.status === 404) return endLocally(); // the session ended on the server
      if (!res.ok) throw new Error(res.statusText);
      for await (const [event, data] of readEvents(res.body)) {
        if (turn !== convo.turn) return;
        if (event === "sentence" || event === "error") { clearTimeout(convo.fillerTimer); convo.queue.push(data.text); pump(); }
        if (event === "done") { convo.replyId = data.message_id; convo.endAfter = data.end_session; }
      }
    } catch (err) {
      if (abort.signal.aborted || turn !== convo.turn) return;
      console.warn("[kiosk] reply failed", err);
      clearTimeout(convo.fillerTimer);
      convo.queue.push(convo.errorLine);
      pump();
    }
    if (turn !== convo.turn) return;
    convo.replyDone = true;
    if (!convo.speaking && !convo.queue.length) replyFinished();
  }

  // The guest cut in: stop talking, and remember what they actually heard: the
  // pieces spoken in full plus the words of the current piece already lit up.
  function cutIn() {
    const heard = [...convo.heard];
    if (convo.speaking && !convo.filler && session && !session.done) {
      const t = audioNow(session);
      const words = session.subWords.filter((w) => w.at !== undefined && w.at <= t).map((w) => w.text);
      if (words.length) heard.push(words.join(" "));
    }
    const spoken = heard.join(" ");
    if (spoken || convo.replyId) convo.cut = { message_id: convo.replyId, spoken_text: spoken };
    convo.turn++;
    if (convo.abort) convo.abort.abort();
    clearTimeout(convo.fillerTimer);
    Object.assign(convo, { queue: [], speaking: false, filler: false, current: "" });
    stop();
    setState("listening");
  }

  // Most of the recognised words appear in what Wayan is saying: that's his own
  // voice coming back through the microphone, not the guest.
  function isEcho(words) {
    const said = new Set((convo.current + " " + convo.queue.join(" ")).toLowerCase().match(/[a-z']+/g) || []);
    const known = words.filter((w) => said.has(w)).length;
    return known / words.length >= 0.7;
  }

  function heardWords(text, final, typed = false) {
    if (!convo.id || convo.state === "starting") return;
    const words = text.toLowerCase().match(/[a-z']+/g) || [];
    if (!words.length) return;
    if (convo.state === "speaking" && !typed && isEcho(words)) return;
    showHeard(text, final);
    convo.idleChecked = false;
    if (convo.state === "listening") armIdle();
    if (convo.state === "speaking" || (convo.state === "thinking" && final)) cutIn();
    if (final) send(text);
  }

  async function startListening() {
    const res = await fetch("/api/speech-token");
    const auth = await res.json();
    if (!res.ok) throw new Error(auth.error || res.statusText);
    const sdk = SpeechSDK;
    const config = sdk.SpeechConfig.fromAuthorizationToken(auth.token, auth.region);
    config.speechRecognitionLanguage = VOICES[convo.language].lang;
    const rec = new sdk.SpeechRecognizer(config, sdk.AudioConfig.fromDefaultMicrophoneInput());
    const hints = sdk.PhraseListGrammar.fromRecognizer(rec);
    PHRASES.forEach((phrase) => hints.addPhrase(phrase));
    rec.recognizing = (_, e) => heardWords(e.result.text, false);
    rec.recognized = (_, e) => { if (e.result.reason === sdk.ResultReason.RecognizedSpeech) heardWords(e.result.text, true); };
    rec.canceled = (_, e) => { if (convo.recognizer === rec) setMicProblem("The microphone stopped: " + (e.errorDetails || e.reason)); };
    convo.recognizer = rec;
    // Tokens last 10 minutes; a long chat needs a fresh one.
    convo.tokenTimer = setInterval(async () => {
      const fresh = await (await fetch("/api/speech-token")).json();
      if (fresh.token) rec.authorizationToken = fresh.token;
    }, 8 * 60 * 1000);
    await new Promise((ok, fail) => rec.startContinuousRecognitionAsync(ok, fail));
  }

  function stopListening() {
    clearInterval(convo.tokenTimer);
    const rec = convo.recognizer;
    convo.recognizer = null;
    if (rec) rec.stopContinuousRecognitionAsync(() => rec.close(), () => rec.close());
  }

  function clearIdle() { clearTimeout(convo.idleTimer); }
  function armIdle() {
    clearIdle();
    const stage = convo.idleChecked ? "end" : "check";
    const wait = stage === "check" ? IDLE_CHECK_MS : IDLE_END_MS - IDLE_CHECK_MS;
    convo.idleTimer = setTimeout(() => idleLine(stage), wait);
  }
  async function idleLine(stage) {
    if (convo.state !== "listening" || !convo.id) return;
    const res = await fetch(`/sessions/${convo.id}/idle`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stage }),
    });
    if (!res.ok) return endLocally();
    const { text, end_session } = await res.json();
    convo.idleChecked = true;
    convo.turn++;
    Object.assign(convo, { queue: [text], heard: [], replyId: null, replyDone: true, endAfter: end_session });
    pump();
  }

  async function startSession() {
    ctx = ctx || new AudioContext(); // created inside the click, or the browser won't play it
    ctx.resume();
    setStatus("");
    setState("starting");
    showAsks(); // after the panel shows the chat controls, so the chips can be measured
    try {
      const res = await fetch("/sessions", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ language: convo.language }),
      });
      if (!res.ok) throw new Error(res.statusText);
      const { session_id, greeting, error_line, fillers } = await res.json();
      Object.assign(convo, { id: session_id, errorLine: error_line, fillers, idleChecked: false, cut: null });
      startListening().catch((err) => setMicProblem("No microphone: " + err.message + (typing ? "" : " (add ?type=1 to type instead)")));
      Object.assign(convo, { queue: [greeting], heard: [], replyId: null, replyDone: true, endAfter: false });
      pump();
    } catch (err) {
      setStatus("Couldn't start: " + err.message, true);
      endLocally();
    }
  }

  function endLocally() {
    convo.turn++;
    if (convo.abort) convo.abort.abort();
    clearIdle();
    stopListening();
    stop();
    hideHeard();
    clearTimeout(convo.fillerTimer);
    if ($("status").dataset.mic) setStatus("");
    Object.assign(convo, { id: null, queue: [], heard: [], current: "", speaking: false, filler: false, cut: null, sentAt: null });
    setState("waiting");
  }

  function stopSession() {
    const id = convo.id;
    endLocally();
    if (id) fetch(`/sessions/${id}`, { method: "DELETE" }).catch(() => {});
  }

  $("end").onclick = stopSession;
  $("langs").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    if (convo.state !== "waiting") return;
    setLanguage(b.dataset.lang);
    startSession();
  }));
  setLanguage(convo.language);
  let invite = 0;
  setInterval(() => {
    if (convo.state !== "waiting") return;
    invite = (invite + 1) % INVITES.length;
    $("invite").textContent = INVITES[invite];
  }, 4000);
  $("typing").hidden = !typing;
  $("typing").onsubmit = (e) => {
    e.preventDefault();
    const text = $("typed").value.trim();
    $("typed").value = "";
    if (text) heardWords(text, true, true);
  };
</script>
</body>
</html>
